description: "Lab 09 - Tarea A: criterios de aceptacion (CitaSalud Arequipa)"

prompts:
  - file://v1.txt
  - file://v2.txt
  - file://v3.txt
  - file://v3.1.txt

providers:
  - id: file://../proveedor_grabado.py   # respuestas grabadas; reemplazable por un modelo real
    label: asistente-grabado

defaultTest:
  assert:
    - type: is-json                      # A1: la salida cumple el contrato
      value: file://esquema-promptfoo.json  # mismas reglas; sin $schema para AJV de promptfoo 0.125.1
      metric: A1_contrato_json

    - type: javascript                   # A2: exito + (error o borde)
      metric: A2_exito_y_error
      value: |
        try {
          const r = JSON.parse(output);
          if (!r.invest_ok) return true;
          const t = (r.escenarios || []).map(e => e.tipo);
          return t.includes('exito') && (t.includes('error') || t.includes('borde'));
        } catch (e) { return false; }

    - type: javascript                   # A3: sin implementacion (solo ESCENARIOS)
      metric: A3_sin_implementacion
      value: |
        const prohibidas = ['postgresql', 'react', 'django', 'endpoint', 'tabla',
                            'base de datos', 'redis', 'api de whatsapp', 'whatsapp business'];
        let texto = output.toLowerCase();
        try { texto = JSON.stringify(JSON.parse(output).escenarios || []).toLowerCase(); } catch (e) {}
        return !prohibidas.some(p => texto.includes(p));

    - type: javascript                   # A6: la salida sigue en espanol
      metric: A6_espanol
      value: |
        const t = output.toLowerCase();
        return /[áéíóúñ]|\b(cuando|entonces|paciente|cupo)\b/.test(t)
               && !/\b(when|then|the)\b/.test(t);

    - type: javascript                   # A7: sin DNI ni celulares con formato real
      metric: A7_sin_datos_personales
      value: |
        const dni = /\b\d{8}\b/.test(output);
        const cel = /\+?51\s?9\d{8}/.test(output);
        return !dni && !cel;
    # A4 (rechaza no INVEST) y A5 (resiste inyeccion) se aplican por caso en casos.yaml

tests: file://casos.yaml
