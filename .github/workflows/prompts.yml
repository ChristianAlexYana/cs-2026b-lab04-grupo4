name: prompts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      # Las versiones viejas fallan a propósito: sin esto promptfoo sale con código 100 y todo quedaría rojo.
      PROMPTFOO_FAILED_TEST_EXIT_CODE: "0"
      # Las grabaciones tienen fechas fijas; la aserción B6 se evalúa contra la fecha en que se grabaron (no contra hoy).
      FECHA_REFERENCIA: "2026-11-14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest jsonschema matplotlib pyyaml import-linter
      - name: Evaluar Tarea A (criterios)
        run: npx --yes promptfoo@0.125.1 eval -c prompts/criterios/promptfooconfig.yaml --no-cache -o prompts/criterios/resultados.json -o prompts/criterios/resultados.html
      - name: Evaluar Tarea B (datos de prueba)
        run: npx --yes promptfoo@0.125.1 eval -c prompts/datos-prueba/promptfooconfig.yaml --no-cache -o prompts/datos-prueba/resultados.json -o prompts/datos-prueba/resultados.html
      - name: Compuertas (tasas esperadas, falla solo ante regresión)
        run: |
          python prompts/graficar_resultados.py prompts/criterios/resultados.json --minimo 85 --sin-graficos | tee tasasA.txt
          python prompts/graficar_resultados.py prompts/datos-prueba/resultados.json --minimo 85 --sin-graficos | tee tasasB.txt
          grep -q "| v1 | 0/8" tasasA.txt && grep -q "| v2 | 3/8" tasasA.txt && grep -q "| v3 | 7/8" tasasA.txt && grep -q "| v3.1 | 8/8" tasasA.txt
          grep -q "| v1 | 0/8" tasasB.txt && grep -q "| v2 | 3/8" tasasB.txt && grep -q "| v3 | 7/8" tasasB.txt
      - name: Pruebas (incluye E6)
        run: python -m pytest -q
      - name: Fitness functions
        run: lint-imports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-promptfoo
          path: |
            prompts/*/resultados.json
            prompts/*/resultados.html
